# Runs SENTBALE with its own PostgreSQL on one machine: `docker compose up -d --build`.
# Put the settings below in a `.env` file next to this one (see .env.example). Serve it behind HTTPS.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentbale
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sentbale
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentbale"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://sentbale:${POSTGRES_PASSWORD}@db:5432/sentbale
      SITE_URL: ${SITE_URL:?Set SITE_URL in .env, e.g. https://sentbale.com}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      ADMIN_SETUP_CODE: ${ADMIN_SETUP_CODE:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PAYMENTS_ALLOW_TEST: ${PAYMENTS_ALLOW_TEST:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - media:/app/data/media

volumes:
  pgdata:
  media:
