# Firebase App Hosting settings (https://firebase.google.com/docs/app-hosting/configure).
# Secrets live in Cloud Secret Manager: `firebase apphosting:secrets:set <name>`. See DEPLOY.md.

runConfig:
  cpu: 1
  memoryMiB: 1024
  # Scales to zero when idle (the first visit after a quiet spell takes a few seconds); caps cost under load.
  minInstances: 0
  maxInstances: 3
  concurrency: 80

env:
  # Public address(es), comma-separated. Forms, checkout and admin saves are accepted only from these.
  - variable: SITE_URL
    value: https://sentbaleperfumes.com,https://www.sentbaleperfumes.com,https://sentbale--sentbale-store.asia-southeast1.hosted.app
  # Uploaded images go to the project's Firebase Storage bucket (App Hosting has no lasting disk).
  - variable: MEDIA_BUCKET
    value: sentbale-store.firebasestorage.app
  # The old pre-PostgreSQL files in data/ are local-only; never import them on a hosted store.
  - variable: SENTBALE_LEGACY_IMPORT
    value: "off"
  # Search engines may list the store, on its main address (the first SITE_URL) only.
  - variable: SITE_INDEXABLE
    value: "true"
  - variable: DATABASE_URL
    secret: databaseUrl
  - variable: ADMIN_SETUP_CODE
    secret: adminSetupCode
  # Email through Resend. The sending domain must be verified at resend.com/domains.
  - variable: RESEND_API_KEY
    secret: resendApiKey
  - variable: MAIL_FROM
    value: SENTBALE <orders@sentbaleperfumes.com>
